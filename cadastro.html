<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Restaurante - Sistema de Pedidos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
   <body>
    <header><h1>RestauranteHPE</h1></header>

    <main>
        <nav>
    <a href="index.html">&larr; Voltar para a Loja</a>
  </nav>
          
      <section class="card">
        <h2>Gerenciar Cardápio </h2>
        <form id="formProduto">
          <input type="hidden" id="prodId" />
          <input type="text" id="prodNome" placeholder="Nome" required />
          <input type="text" id="prodDesc" placeholder="Descrição" required />
          <input
            type="number"
            id="prodPreco"
            step="0.01"
            placeholder="Preço"
            required
          />
          <input type="text" id="prodCat" placeholder="Categoria" required />
         <input type="text" id="prodImg" placeholder="Caminho da Imagem" required />
          <button type="submit" id="btnSalvarProd">Salvar Produto</button>
          <button type="button" id="btnCancelarEdit" style="display: none">
            Cancelar
          </button>
        </form>

        
    </main>

    <script src="script.js"></script>
  </body>
  </html>
