<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante - Gerenciar Cardápio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <div class="brand">
          <span class="brand-icon">🍽️</span>
          <h1 class="brand-title">Restaurante<span>HPE</span></h1>
        </div>

        <nav class="main-nav">
          <a href="index.html" class="nav-btn nav-btn-outline">
            <span class="icon">&larr;</span> Voltar para a Loja
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Gerenciar Cardápio</h2>
        <form id="formProduto">
          <input type="hidden" id="prodId" />
          <input type="text" id="prodNome" placeholder="Nome" required />
          <input type="text" id="prodDesc" placeholder="Descrição" required />
          <input
            type="number"
            id="prodPreco"
            step="0.01"
            placeholder="Preço"
            required
          />
          <input type="text" id="prodCat" placeholder="Categoria" required />
          <input
            type="text"
            id="prodImg"
            placeholder="Caminho/URL da Imagem"
            required
          />
          <button type="submit" id="btnSalvarProd">Salvar Produto</button>
          <button
            type="button"
            id="btnCancelarEdit"
            class="danger"
            style="display: none"
          >
            Cancelar
          </button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
